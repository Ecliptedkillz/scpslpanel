services:
  panel:
    build: .
    container_name: scpsl-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Panel__BootstrapUsername: admin
      Panel__BootstrapPassword: ${PANEL_BOOTSTRAP_PASSWORD:?Set PANEL_BOOTSTRAP_PASSWORD}
    volumes:
      - panel-data:/app/data
      # Mount the server directories the panel is allowed to manage:
      # - /opt/scpsl:/servers/scpsl

volumes:
  panel-data:
